<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">From your application to finished media</title><desc id="desc">Your server sends template fields through the VidPlate SDK. VidPlate queues the job, your Browser Node renders it and a signed webhook tells your application to request output links.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3446db" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="430" rx="24" fill="#f3f5fc"/>
<g font-family="Arial, sans-serif"><text x="44" y="54" fill="#3446db" font-size="13" font-weight="700" letter-spacing="2">VIDPLATE API / TEMPLATE RENDERING</text><text x="44" y="98" fill="#142257" font-size="32" font-weight="700">Your code. Your designs. Your machines.</text>
<g fill="white" stroke="#d6def0"><rect x="44" y="143" width="250" height="194" rx="18"/><rect x="331" y="143" width="250" height="194" rx="18"/><rect x="618" y="143" width="250" height="194" rx="18"/><rect x="905" y="143" width="250" height="194" rx="18"/></g>
<g fill="#3446db" font-size="13" font-weight="700"><text x="66" y="178">01 / YOUR SERVER</text><text x="353" y="178">02 / VIDPLATE API</text><text x="640" y="178">03 / BROWSER NODE</text><text x="927" y="178">04 / YOUR APPLICATION</text></g>
<g fill="#142257" font-size="22" font-weight="700"><text x="66" y="219">Send the request</text><text x="353" y="219">Queue the job</text><text x="640" y="219">Render the media</text><text x="927" y="219">Collect the files</text></g>
<g fill="#536282" font-size="16"><text x="66" y="256">Template + fields + sizes</text><text x="66" y="285">Node.js / TypeScript SDK</text><text x="353" y="256">Validation and job routing</text><text x="353" y="285">Status and delivery</text><text x="640" y="256">Your connected machine</text><text x="640" y="285">Video and image outputs</text><text x="927" y="256">Signed completion webhook</text><text x="927" y="285">Request download links</text></g>
<g stroke="#3446db" stroke-width="2" marker-end="url(#arrow)"><path d="M299 239H322"/><path d="M586 239H609"/><path d="M873 239H896"/></g>
<text x="44" y="386" fill="#536282" font-size="15">Keep API keys on your server. Connect a Browser Node before sending a template render.</text></g></svg>